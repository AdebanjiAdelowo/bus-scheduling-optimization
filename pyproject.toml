[project]
name = "busopt"
version = "0.1.0"
description = "Forecast-informed bus frequency setting and fleet allocation: forecasting, MILP/stochastic optimization, simulation, and a tool-using planning agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "ortools>=9.11",
    "numba>=0.60",
    "matplotlib>=3.9",
    "pydantic>=2.8",
    "pyyaml>=6",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.38"]
neural = ["torch>=2.4"]
agent = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
busopt = "busopt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/busopt"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Gitignore discovery walks parent directories and stalls on this machine; exclusions are explicit instead.
respect-gitignore = false
extend-exclude = ["data", "results", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
